name: Publish portfolio and FreeBoard

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      freeboard_ref:
        description: FreeBoard branch, tag, or commit to publish
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out portfolio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: portfolio
          persist-credentials: false
      - name: Check out FreeBoard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Ataullha/FreeBoard
          ref: ${{ inputs.freeboard_ref || 'main' }}
          path: whiteboard
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: whiteboard/package-lock.json
      - name: Install FreeBoard dependencies
        run: npm ci
        working-directory: whiteboard
      - name: Check formatting, tests, and production build
        run: npm run format:check && npm run check && npm audit --omit=dev --audit-level=high
        working-directory: whiteboard
      - name: Assemble portfolio and whiteboard
        shell: bash
        run: |
          mkdir -p _site
          cp -a portfolio/. _site/
          rm -rf _site/.git _site/.github _site/redirects
          mkdir -p _site/FreeBoard _site/FreePod
          cp -a whiteboard/dist/. _site/FreeBoard/
          cp -a portfolio/redirects/whiteboard/. _site/FreePod/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/FreeBoard/index.html
          test -s _site/FreeBoard/sw.js
          test -s _site/FreeBoard/manifest.webmanifest
          test -s _site/FreePod/index.html
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
